name: Publish npm Package

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Ensure OIDC-capable npm CLI
        run: npm install --global "npm@>=11.15.0 <12"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Run upstream and PW tests
        run: npm run test:all

      - name: Verify npm package contents
        run: npm pack --dry-run --json

      - name: Read package identity
        id: package
        shell: bash
        run: |
          echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check whether version already exists
        id: exists
        shell: bash
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm using OIDC
        if: steps.exists.outputs.published == 'false'
        run: npm publish --access public
